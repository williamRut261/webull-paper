# Owner-requested sandbox GET-only authentication probe; never submits trades.
name: Webull PaperTrade API Connection (read only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/webull-paper-connection.yml'
      - 'webull_paper/check_connection.py'
      - 'webull_paper/shared_cutover_probe.py'

permissions:
  contents: read

jobs:
  check-webull-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBULL_PAPER_APP_KEY: ${{ secrets.WEBULL_PAPER_APP_KEY }}
      WEBULL_PAPER_APP_SECRET: ${{ secrets.WEBULL_PAPER_APP_SECRET }}
      WEBULL_PAPER_ACCOUNT_SHA256: ${{ secrets.WEBULL_PAPER_ACCOUNT_SHA256 }}
      WEBULL_PAPER_VAR_KEY_PRESENT: ${{ vars.WEBULL_PAPER_APP_KEY != '' }}
      WEBULL_PAPER_VAR_SECRET_PRESENT: ${{ vars.WEBULL_PAPER_APP_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Webull OpenAPI Python SDK
        run: python -m pip install webull-openapi-python-sdk
      - name: Check Webull paper account access (GET-only, sandbox)
        run: python webull_paper/check_connection.py
      - name: Independently audit index-0 CASH sandbox holdings and open orders (GET only)
        run: python -m webull_paper.shared_cutover_probe
