name: Seven-Agent Webull Sandbox Trade (SHARED ORB CASH ACCOUNT)
on:
  workflow_dispatch:
  schedule:
    # 11:22 Eastern: prior-evening seven-agent research must be published first.
    - cron: "22 11 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  # Existing paper bots share one Webull SDK and use this lock; do not race.
  group: webull-paper-order
  cancel-in-progress: false

jobs:
  seven-agent-sandbox:
    # Manual dispatch never places an order. Shared 50/50 cutover must
    # be explicitly enabled and reviewed before this executor can trade.
    if: github.event_name == 'schedule' && vars.AI_AGENTS_SANDBOX_EXECUTE_ENABLED != 'false' && vars.WEBULL_SHARED_5050_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: .
      AI_AGENTS_SANDBOX_EXECUTE_ENABLED: ${{ vars.AI_AGENTS_SANDBOX_EXECUTE_ENABLED || 'true' }}
      WEBULL_SHARED_5050_ENABLED: ${{ vars.WEBULL_SHARED_5050_ENABLED || 'true' }}
      AI_PAPER_BROKER_KILL_SWITCH: ${{ vars.AI_PAPER_BROKER_KILL_SWITCH || 'false' }}
      WEBULL_PAPER_ACCOUNT_INDEX: "0"
      WEBULL_PAPER_ACCOUNT_SHA256: ${{ secrets.WEBULL_PAPER_ACCOUNT_SHA256 }}
      WEBULL_PAPER_APP_KEY: ${{ secrets.WEBULL_PAPER_APP_KEY }}
      WEBULL_PAPER_APP_SECRET: ${{ secrets.WEBULL_PAPER_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned sandbox SDK and quote dependencies
        run: python -m pip install -r requirements.txt webull-openapi-python-sdk==3.0.3
      - name: Eastern trading day
        id: day
        run: echo "key=$(TZ=America/New_York date +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore persistent same-day no-retry order claim
        id: claim
        uses: actions/cache/restore@v4
        with:
          path: state/agent-sandbox
          key: agent-sandbox-order-v1-${{ steps.day.outputs.key }}
      - name: Submit at most one agent-authorized sandbox order
        run: |
          mkdir -p logs
          set -o pipefail
          python -m research.agent_sandbox_executor --execute 2>&1 | tee logs/agent-sandbox.log
      - name: Persist claim even after submission error or uncertain fill
        if: always() && steps.claim.outputs.cache-hit != 'true' && hashFiles('state/agent-sandbox/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state/agent-sandbox
          key: agent-sandbox-order-v1-${{ steps.day.outputs.key }}
      - name: Preserve a redacted paper trade audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-agent-sandbox-${{ github.run_id }}
          path: logs/agent-sandbox.log
          retention-days: 30
