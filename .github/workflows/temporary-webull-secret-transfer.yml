name: Temporary Webull PAPER secret transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    if: github.repository == 'williamRut261/webull-paper' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor_id == '339034312'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/955692373304/locations/global/workloadIdentityPools/webull-paper-transfer/providers/github-main
          service_account: gh-webull-secret-transfer@gen-lang-client-0756501827.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: gen-lang-client-0756501827

      - name: Transfer existing credentials to Secret Manager
        shell: bash
        env:
          WEBULL_PAPER_APP_KEY: ${{ secrets.WEBULL_PAPER_APP_KEY }}
          WEBULL_PAPER_APP_SECRET: ${{ secrets.WEBULL_PAPER_APP_SECRET }}
          WEBULL_PAPER_ACCOUNT_SHA256: ${{ secrets.WEBULL_PAPER_ACCOUNT_SHA256 }}
        run: |
          set +x
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          project = "gen-lang-client-0756501827"
          names = (
              "WEBULL_PAPER_APP_KEY",
              "WEBULL_PAPER_APP_SECRET",
              "WEBULL_PAPER_ACCOUNT_SHA256",
          )
          if any(not os.environ.get(name) for name in names):
              print("A required GitHub Actions secret is unavailable. No values were printed.", file=sys.stderr)
              raise SystemExit(1)

          for name in names:
              result = subprocess.run(
                  [
                      "gcloud", "secrets", "versions", "add", name,
                      f"--project={project}", "--data-file=-", "--quiet",
                  ],
                  input=os.environ[name].encode("utf-8"),
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              if result.returncode:
                  print("Secret transfer failed. No secret values were printed.", file=sys.stderr)
                  raise SystemExit(result.returncode)
          PY
