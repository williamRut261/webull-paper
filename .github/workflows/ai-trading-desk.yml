name: AI Trading Desk (SEVEN-PERSON RISK REVIEW FOR PAPER EXECUTOR)
on:
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        description: Research provider; compare calls EVERY configured API and may incur charges
        required: true
        default: gemini
        options: [gemini, openai, claude, grok, compare]
      focus_symbol:
        type: choice
        description: Symbol to include in seven-agent research
        required: true
        default: SPY
        options: [GDXD, GDXU, TQQQ, SPY, QQQ, GLD, TLT, BIL]
  schedule:
    - cron: "35 23 * * 1-5"
    # Before each market open, refresh structured opinions from prior close.
    # These remain research until the independent broker executor approves.
    - cron: "10 8 * * 1-5"
      timezone: "America/New_York"

permissions:
  # Publish ONLY sanitized public opinions and a separate virtual paper ledger.
  contents: write
  checks: write

concurrency:
  group: ai-desk-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name == 'workflow_dispatch' || vars.AI_DESK_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      AI_DESK_PROVIDER: ${{ github.event_name == 'schedule' && 'gemini' || inputs.provider || 'gemini' }}
      AI_DESK_GEMINI_MODEL: ${{ vars.AI_DESK_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      AI_DESK_OPENAI_MODEL: ${{ vars.AI_DESK_OPENAI_MODEL || 'gpt-5-mini' }}
      AI_DESK_CLAUDE_MODEL: ${{ vars.AI_DESK_CLAUDE_MODEL || 'claude-haiku-4-5' }}
      AI_DESK_GROK_MODEL: ${{ vars.AI_DESK_GROK_MODEL || 'grok-4.7' }}
      AI_DESK_FOCUS: ${{ inputs.focus_symbol || 'SPY' }}
      AI_PAPER_KILL_SWITCH: ${{ vars.AI_PAPER_KILL_SWITCH || 'false' }}
      AI_OFFICE_CHECKS_ENABLED: 'true'
      AI_OFFICE_GITHUB_TOKEN: ${{ github.token }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run seven research specialists (NO BROKER CONNECTION)
        run: |
          set -o pipefail
          python -m research.ai_desk --provider "$AI_DESK_PROVIDER" --symbol "$AI_DESK_FOCUS" --out out/ai-desk
      - name: Update isolated virtual paper ledger and sanitized agent feed
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ -f out/ai-desk/report.json ]; then
            kill_arg=""
            if [ "$AI_PAPER_KILL_SWITCH" = "true" ]; then kill_arg="--kill"; fi
            python -m research.agent_paper \
              --report out/ai-desk/report.json \
              --ledger research/agent_virtual_ledger.json \
              --status research/ai_desk_status.json $kill_arg
          else
            echo "No research report; previous public status remains unchanged."
          fi
      - name: Publish public research-only snapshot (never broker credentials)
        if: always() && github.ref == 'refs/heads/main'
        run: |
          # Both files contain allowlisted agent opinions and VIRTUAL cash only.
          # Never publish raw API responses, model prompts, secret env, or account data.
          git add research/ai_desk_status.json research/agent_virtual_ledger.json
          if git diff --cached --quiet; then
            echo "No new public research snapshot"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'research: update sanitized seven-agent virtual paper snapshot [skip ci]'
            # The hourly AgentOffice publisher may advance main during inference.
            # Rebase ONLY sanitized, credential-free research files; never force push.
            for retry in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            echo "AI_DESK_RESEARCH_PUBLISH_FAILED" >&2
            exit 1
          fi
      - name: Write summary
        if: always()
        run: |
          if test -f out/ai-desk/report.md; then
            cat out/ai-desk/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was produced; no brokerage actions occurred." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save research JSON and agent opinions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-desk-research-${{ github.run_id }}
          path: out/ai-desk/
          if-no-files-found: warn
          retention-days: 14
