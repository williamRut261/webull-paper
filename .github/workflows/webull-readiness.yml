name: Webull strategy PaperTrade Allocation Plan (read-only)
on:
  pull_request:
    paths:
      - 'webull_paper/**'
      - '.github/workflows/webull-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webull-paper-readonly-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      WEBULL_PAPER_APP_KEY: ${{ secrets.WEBULL_PAPER_APP_KEY }}
      WEBULL_PAPER_APP_SECRET: ${{ secrets.WEBULL_PAPER_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original strategy and official Webull SDK
        run: python -m pip install -r requirements.txt webull-openapi-python-sdk
      - name: Compute original strategy allocation and inspect Webull CASH sandbox account (no orders)
        run: python -m webull_paper.paper_orders
      - name: Audit timestamp freshness for all 69 Webull snapshots (GET only)
        run: python -m webull_paper.audit_quotes
      - name: Verify sandbox account and order-history API shape (GET only)
        run: python -m webull_paper.order_preflight
