name: Webull Paper Auto-Trading (SANDBOX ONLY)

on:
  workflow_dispatch:
  schedule:
    # Stage at 14:58 ET / 13:58 Houston, 50 minutes before the 15:48 ET signal.
    # GitHub Actions schedules are best-effort; the runner waits until signal time.
    # This saves ~110 waiting minutes per trading weekday versus the prior 160-minute stage.
    - cron: "58 14 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: webull-paper-order
  cancel-in-progress: false

jobs:
  run-webull-sandbox:
    # Owner activated after read-only API, cash-account-pin and order-history checks passed.
    # Only scheduled sessions may attempt SANDBOX orders; manual dispatch never trades.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      WEBULL_PAPER_APP_KEY: ${{ secrets.WEBULL_PAPER_APP_KEY }}
      WEBULL_PAPER_APP_SECRET: ${{ secrets.WEBULL_PAPER_APP_SECRET }}
      WEBULL_PAPER_ACCOUNT_SHA256: ${{ secrets.WEBULL_PAPER_ACCOUNT_SHA256 }}
      WEBULL_PAPER_EXECUTE_ENABLED: "true"
      WEBULL_TRADER_PAPER_ENABLED: "true"
      WEBULL_PAPER_ACCOUNT_INDEX: "0"
      WEBULL_SHARED_5050_ENABLED: ${{ vars.WEBULL_SHARED_5050_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Webull PaperTrade SDK and strategy dependencies
        run: python -m pip install -r requirements.txt webull-openapi-python-sdk==3.0.3
      - name: Eastern trading date
        id: date
        run: echo "day=$(TZ=America/New_York date +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Webull paper daily execution claim
        id: state
        uses: actions/cache/restore@v4
        with:
          path: state/webull-paper
          key: webull-public-paper-v1-${{ steps.date.outputs.day }}
      - name: Execute WEBULL SANDBOX paper orders only
        if: env.WEBULL_SHARED_5050_ENABLED != 'true'
        run: |
          mkdir -p logs
          set -o pipefail
          python -m webull_paper.automatic 2>&1 | tee logs/webull-paper.log
      - name: Save daily execution claim, including failures
        if: always() && env.WEBULL_SHARED_5050_ENABLED != 'true' && steps.state.outputs.cache-hit != 'true' && hashFiles('state/webull-paper/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state/webull-paper
          key: webull-public-paper-v1-${{ steps.date.outputs.day }}
      - name: Summarize paper signals and risks (ADVISORY ONLY - NO ORDERS)
        if: always() && env.WEBULL_SHARED_5050_ENABLED != 'true'
        run: |
          python -m research.beethoven_advisory \
            --log logs/webull-paper.log \
            --output logs/beethoven-research.json \
            || echo "Research report unavailable; original sandbox trading unaffected"
      - name: Close ORB-owned positions only and preserve agent holdings
        if: env.WEBULL_SHARED_5050_ENABLED == 'true'
        run: |
          mkdir -p logs
          set -o pipefail
          python -m trader_combo.shared_close 2>&1 | tee logs/shared-orb-close.log
      - name: Save shared ORB close claim on any attempted close
        if: always() && env.WEBULL_SHARED_5050_ENABLED == 'true' && hashFiles('state/shared-orb-close/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state/shared-orb-close
          key: shared-orb-close-v1-${{ steps.date.outputs.day }}
      - name: Preserve paper order audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webull-sandbox-orders-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/
          retention-days: 30
